<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenData - 地方美食資料練習</title>
    <link rel="stylesheet" href="CSS/20260924.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .wrapper {
            width: 1024px;
            margin-top: 50px;
            margin-bottom: 0;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 2px 2px 2px 2px #ccc;
            padding: 15px;
            overflow: hidden;
        }

        .demo {
            width: 32%;
            box-shadow: 2px 2px 1px 1px #727171;
            margin-top: 15px;
            float: left;
            margin-right: 1%;
        }

        .demo .logo {
            width: 100%;
            height: 220px;
            background-image: url(images/landscape.avif);
        }

        /* RWD */
        @media screen and (max-width:1024px) {
            .wrapper{
                width: 94%;
                padding: 15px;
            }

            .demo{
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="display-1 fw-900 title-01">地方美食餐廳列表</div>
    <div class="wrapper" id="foodlist">
        <div class="demo">
            <div class="logo bg-img" style="background-image: url(images/landscape.avif);"></div>
            <p class="title-03">店家:XXX</p>
            <p class="title-03">電話:XXX</p>
        </div>
    </div>


    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/TravelFood.js"></script>
    <script>

        food.forEach(function (item) {
            // console.log(item.Name);
            // console.log(item.City);
            // console.log(item.Email);
            $("#foodlist").append('<div class="demo"><div class="logo bg-img" style="background-image: url(' + item.PicURL + ');"></div><p class="title-03">店家:'+item.Name+'</p><p class="title-03">電話:'+item.Tel+'</p></div>')
        });


    
    </script>
</body>

</html>
